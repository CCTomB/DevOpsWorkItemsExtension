trigger: none

parameters:
  - name: workItemId
    type: string
    default: ''
  - name: commitHash
    type: string
    default: ''
  - name: repositoryName
    displayName: Repository name
    type: string
    default: ''
  - name: repositoryProjectName
    displayName: Repository project name
    type: string
    default: ''
  - name: workItemProjectId
    displayName: Work item project ID
    type: string
    default: ''

pool:
  vmImage: 'windows-latest'

variables:
  # Create/set this secret variable in the pipeline UI or variable group:
  # PERSONAL_ACCESS_TOKEN (secret) — PAT with Work Item and Code permissions
  configuration: 'Release'

steps:
- task: UseDotNet@2
  displayName: 'Use .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.0.x' # ensure agent has .NET 10 SDK; adjust if needed

- script: |
    dotnet restore DevOpsWorkItems/DevOpsWorkItems.csproj
    dotnet publish DevOpsWorkItems/DevOpsWorkItems.csproj -c $(configuration) -o $(Build.ArtifactStagingDirectory)/publish
  displayName: 'dotnet restore && publish'

- pwsh: |
    $env:ORG_URL = "$(System.CollectionUri)"
    # If using full organization url, you can set ORG_URL as: https://dev.azure.com/yourOrg/
    $env:PROJECT_ID = '${{ parameters.workItemProjectId }}'
    if ([string]::IsNullOrWhiteSpace($env:PROJECT_ID)) {
      $env:PROJECT_ID = "$(System.TeamProjectId)"
    }
    $env:REPOSITORY_PROJECT_NAME = '${{ parameters.repositoryProjectName }}'
    if ([string]::IsNullOrWhiteSpace($env:REPOSITORY_PROJECT_NAME)) {
      $env:REPOSITORY_PROJECT_NAME = $env:PROJECT_ID
    }
    Write-Host "Task/pipeline project ID: $env:PROJECT_ID"
    Write-Host "Repository project input: '$env:REPOSITORY_PROJECT_NAME'"
    if ([string]::IsNullOrWhiteSpace($env:REPOSITORY_PROJECT_NAME)) {
      throw 'repositoryProjectName was not supplied to the pipeline. Queue the updated extension and enter the project name or GUID containing the repository.'
    }
    if ('${{ parameters.repositoryName }}' -ne '') {
      $env:REPOSITORY_NAME = '${{ parameters.repositoryName }}'
    } else {
      $env:REPOSITORY_NAME = "$(Build.Repository.Name)"
    }
    if ('${{ parameters.commitHash }}' -ne '') {
      $env:COMMIT_HASH = '${{ parameters.commitHash }}'
    } else {
      $env:COMMIT_HASH = "$(Build.SourceVersion)"
    }
    $oauthToken = $env:SYSTEM_ACCESSTOKEN
    $patToken = $env:PERSONAL_ACCESS_TOKEN
    $hasOAuthToken = -not [string]::IsNullOrWhiteSpace($oauthToken)
    $hasPatToken = -not [string]::IsNullOrWhiteSpace($patToken)
    $tokenState = if ($hasPatToken) { "PAT present ($($patToken.Length) characters); selected over System.AccessToken" } elseif ($hasOAuthToken) { "System.AccessToken present ($($oauthToken.Length) characters)" } else { 'missing' }
    Write-Host "Azure DevOps token state: $tokenState"
    if ($tokenState -eq 'missing') {
      throw 'No Azure DevOps token is available. Enable OAuth access for the pipeline job or configure PERSONAL_ACCESS_TOKEN as a secret variable.'
    }
    if ('${{ parameters.workItemId }}' -ne '') {
      $env:WORK_ITEM_ID = '${{ parameters.workItemId }}'
    } elseif ('$(workItemId)' -ne '') {
      $env:WORK_ITEM_ID = '$(workItemId)'
    }

    Write-Host "Running tool for work item: $env:WORK_ITEM_ID"
    dotnet "$(Build.ArtifactStagingDirectory)/publish/DevOpsWorkItems.dll" --workItemId=$env:WORK_ITEM_ID
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    PERSONAL_ACCESS_TOKEN: $(PERSONAL_ACCESS_TOKEN)
  displayName: 'Run linking app'